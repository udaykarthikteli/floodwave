{% extends "base.html" %}
{% block title %}{{ t('title_pred') }}{% endblock %}

{% block content %}
<section class="section" style="padding-top:140px;">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow"><span class="dot"></span> {{ t('pred_eyebrow') }}</div>
      <h2>{{ t('pred_h2') }}</h2>
      <p>{{ t('pred_p') }}</p>
    </div>

    <div class="pred-layout">
      <div class="glass-card reveal" id="globe-panel">
        <div id="globe-canvas-wrap"></div>
        <p class="globe-hint">{{ t('globe_hint') }}</p>
        <div class="location-chip" id="locationChip">
          <span>{{ t('no_location') }}</span>
        </div>
      </div>

      <div class="glass-card form-card reveal" style="position:relative;">
        <div class="loading-overlay" id="formLoading"><div class="spinner"></div></div>
        <h3 style="margin-bottom:18px;">{{ t('form_title') }}</h3>
        <form id="predictForm">
          <div class="form-grid">
            <div class="field">
              <label for="f-lat">{{ t('lbl_lat') }}</label>
              <input type="text" id="f-lat" readonly placeholder="{{ t('ph_globe') }}">
            </div>
            <div class="field">
              <label for="f-lon">{{ t('lbl_lon') }}</label>
              <input type="text" id="f-lon" readonly placeholder="{{ t('ph_globe') }}">
            </div>
            <div class="field">
              <label for="f-country">{{ t('lbl_country') }}</label>
              <input type="text" id="f-country" placeholder="{{ t('ph_country') }}">
            </div>
            <div class="field">
              <label for="f-state">{{ t('lbl_state') }}</label>
              <input type="text" id="f-state" placeholder="{{ t('ph_state') }}">
            </div>
            <div class="field" style="grid-column: span 2;">
              <label for="f-city">{{ t('lbl_city') }}</label>
              <input type="text" id="f-city" placeholder="{{ t('ph_city') }}">
            </div>

            <div class="field">
              <label for="f-rainfall">{{ t('lbl_rainfall') }}</label>
              <input type="number" step="0.1" id="f-rainfall" value="45" required>
            </div>
            <div class="field">
              <label for="f-temperature">{{ t('lbl_temp') }}</label>
              <input type="number" step="0.1" id="f-temperature" value="24" required>
            </div>
            <div class="field">
              <label for="f-humidity">{{ t('lbl_humidity') }}</label>
              <input type="number" step="0.1" id="f-humidity" value="65" required>
            </div>
            <div class="field">
              <label for="f-river">{{ t('lbl_river') }}</label>
              <input type="number" step="0.1" id="f-river" value="3.5" required>
            </div>
            <div class="field">
              <label for="f-elevation">{{ t('lbl_elev') }}</label>
              <input type="number" step="1" id="f-elevation" value="80" required>
            </div>
            <div class="field">
              <label for="f-soil">{{ t('lbl_soil') }}</label>
              <input type="number" step="0.01" min="0" max="1" id="f-soil" value="0.35" required>
            </div>
            <div class="field">
              <label for="f-drainage">{{ t('lbl_drain') }}</label>
              <input type="number" step="1" id="f-drainage" value="60" required>
            </div>
            <div class="field">
              <label for="f-population">{{ t('lbl_pop') }}</label>
              <input type="number" step="1" id="f-population" value="2500" required>
            </div>
            <div class="field">
              <label for="f-impervious">{{ t('lbl_imperv') }}</label>
              <input type="number" step="1" id="f-impervious" value="45" required>
            </div>
            <div class="field">
              <label for="f-wind">{{ t('lbl_wind') }}</label>
              <input type="number" step="0.1" id="f-wind" value="12" required>
            </div>
            <div class="field">
              <label for="f-landuse">{{ t('lbl_landuse') }}</label>
              <select id="f-landuse">
                {% for lu in ['Urban','Suburban','Agricultural','Forest','Wetland','Coastal','Barren'] %}
                <option value="{{ lu }}">{{ t('landuse_' ~ lu) }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="field">
              <label for="f-history">{{ t('lbl_history') }}</label>
              <select id="f-history">
                <option value="no">{{ t('opt_no') }}</option>
                <option value="yes">{{ t('opt_yes') }}</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-block predict-cta" id="predictBtn" data-flood-btn>
            <span class="flood-fill"></span><span class="btn-label">{{ t('cta_predict') }}</span>
          </button>
        </form>
      </div>
    </div>

    <div id="result-panel" style="display:none;"></div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="{{ url_for('static', filename='js/globe.js') }}"></script>
<script src="{{ url_for('static', filename='js/prediction.js') }}"></script>
{% endblock %}
