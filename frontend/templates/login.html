{% extends "base.html" %}
{% block title %}{{ t('title_login') }}{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="glass-card auth-card reveal in-view">
    {% include 'partials/_logo.html' %}
    <h2 style="margin-top:16px;">{{ t('login_title') }}</h2>
    <p class="sub">{{ t('login_sub') }}</p>

    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

    <form method="POST" action="{{ url_for('login_page') }}">
      <div class="field">
        <label for="email">{{ t('lbl_email') }}</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">{{ t('lbl_password') }}</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <div class="remember-row">
        <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" name="remember"> {{ t('remember') }}</label>
        <a href="#" style="color:var(--cyan);">{{ t('forgot') }}</a>
      </div>
      <button type="submit" class="btn btn-block" data-flood-btn><span class="flood-fill"></span><span class="btn-label">{{ t('btn_login') }}</span></button>
    </form>
    <div class="auth-foot">{{ t('login_foot') }} <a href="{{ url_for('signup_page') }}" style="color:var(--cyan);">{{ t('link_signup') }}</a></div>
  </div>
</div>
{% endblock %}
